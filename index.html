<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customizable Bio Maker</title>
  <style>
    /* ==========================================================================
       1. CSS VARIABLES & THEMING
       ========================================================================== */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --button-bg: #334155;
      --button-text: #ffffff;
      --border-radius: 12px;
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      --bg-image: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--bg-color);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ==========================================================================
       2. LAYOUT & CONTAINERS
       ========================================================================== */
    .app-container {
      width: 100%;
      max-width: 900px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .view-toggle-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .editor-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* Responsive Orientation Handling */
    @media (min-width: 768px) {
      .editor-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* ==========================================================================
       3. FORM & CONTROL STYLES (EDITOR)
       ========================================================================== */
    .panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--border-radius);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .panel h2 {
      font-size: 1.2rem;
      color: var(--accent-color);
      margin-bottom: 5px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .input-group label {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
      color: #fff;
      outline: none;
    }

    input[type="color"] {
      border: none;
      width: 100%;
      height: 40px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }

    input[type="file"] {
      font-size: 0.85rem;
    }

    .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--button-bg);
      color: var(--button-text);
    }

    /* ==========================================================================
       4. BIO CARD PREVIEW & VISITOR VIEW
       ========================================================================== */
    .bio-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 30px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .bio-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-color);
      background: #000;
    }

    .bio-name {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .bio-text {
      font-size: 0.95rem;
      line-height: 1.4;
      opacity: 0.9;
      white-space: pre-wrap;
    }

    .bio-links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .bio-link-btn {
      width: 100%;
      padding: 12px;
      background: var(--button-bg);
      color: var(--button-text);
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: transform 0.1s, filter 0.2s;
      display: block;
    }

    .bio-link-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    /* Music Player Controls */
    .music-controls {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Action Bar -->
    <div class="view-toggle-bar">
      <h1 id="mode-title">Bio Editor</h1>
      <div>
        <button id="toggle-view-btn" class="btn btn-secondary">Switch to Visitor View</button>
        <button id="share-btn" class="btn">Copy Share Link</button>
      </div>
    </div>

    <!-- MAIN EDITOR INTERFACE -->
    <div id="editor-section" class="editor-grid">
      
      <!-- Panel 1: Profile & Links Config -->
      <div class="panel">
        <h2>1. Profile Info</h2>
        <div class="input-group">
          <label for="username-input">Username</label>
          <input type="text" id="username-input" placeholder="e.g. Alex" />
        </div>
        <div class="input-group">
          <label for="bio-input">Bio / Description</label>
          <textarea id="bio-input" rows="3" placeholder="Write something about yourself..."></textarea>
        </div>
        <div class="input-group">
          <label>Avatar Image</label>
          <input type="file" id="avatar-file" accept="image/*" />
        </div>

        <h2>2. Social Links</h2>
        <div id="links-editor-list" class="input-group"></div>
        <button id="add-link-btn" class="btn btn-secondary">+ Add New Link</button>
      </div>

      <!-- Panel 2: Theme & Audio Assets -->
      <div class="panel">
        <h2>3. Theme Settings</h2>
        <div class="input-group">
          <label>Background Color</label>
          <input type="color" id="bg-color-picker" value="#0f172a" />
        </div>
        <div class="input-group">
          <label>Card Color</label>
          <input type="color" id="card-color-picker" value="#1e293b" />
        </div>
        <div class="input-group">
          <label>Text Color</label>
          <input type="color" id="text-color-picker" value="#f8fafc" />
        </div>
        <div class="input-group">
          <label>Accent Color</label>
          <input type="color" id="accent-color-picker" value="#38bdf8" />
        </div>
        <div class="input-group">
          <label>Button Background</label>
          <input type="color" id="btn-color-picker" value="#334155" />
        </div>
        <div class="input-group">
          <label>Background Image (Optional)</label>
          <input type="file" id="bg-file" accept="image/*" />
        </div>

        <h2>4. Media Assets</h2>
        <div class="input-group">
          <label>Loopable Music (MP3/OGG/WAV)</label>
          <input type="file" id="music-file" accept="audio/*" />
        </div>
        <div class="input-group">
          <label>Button Sound Effect (Click Sound)</label>
          <input type="file" id="sfx-file" accept="audio/*" />
        </div>

        <button id="save-db-btn" class="btn" style="margin-top: 15px;">Save Profile to Database</button>
      </div>

    </div>

    <!-- VISITOR MODE PREVIEW -->
    <div id="visitor-section" class="hidden">
      <div class="bio-card">
        <img id="preview-avatar" class="bio-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%23333'/></svg>" alt="Avatar" />
        <div id="preview-username" class="bio-name">Your Name</div>
        <div id="preview-bio" class="bio-text">Your bio description will appear here.</div>
        
        <div id="preview-links" class="bio-links"></div>

        <div class="music-controls">
          <button id="play-music-btn" class="btn btn-secondary">Play Music 🎵</button>
          <span id="music-status">Audio Ready</span>
        </div>
      </div>
    </div>

  </div>

  <!-- ==========================================================================
     5. JAVASCRIPT LOGIC & INDEXEDDB MANAGEMENT
     ========================================================================== -->
  <script>
    /* ----------------------------------------------------------------------
       INDEXEDDB DATABASE MANAGER
       ---------------------------------------------------------------------- */
    const DB_NAME = 'BioMakerDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'user_profile';

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveProfileToDB(data) {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        data.id = 'current_user';
        const request = store.put(data);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    async function loadProfileFromDB() {
      const db = await openDatabase();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.get('current_user');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    /* ----------------------------------------------------------------------
       STATE MANAGEMENT
       ---------------------------------------------------------------------- */
    let profileState = {
      username: 'Alex',
      bio: 'Welcome to my customizable bio page!',
      links: [
        { title: 'My Portfolio', url: 'https://example.com' },
        { title: 'Twitter / X', url: 'https://twitter.com' }
      ],
      theme: {
        bg: '#0f172a',
        card: '#1e293b',
        text: '#f8fafc',
        accent: '#38bdf8',
        button: '#334155'
      },
      avatarBlob: null,
      bgImageBlob: null,
      musicBlob: null,
      sfxBlob: null
    };

    /* ----------------------------------------------------------------------
       SEAMLESS AUDIO LOOPING (WEB AUDIO API)
       ---------------------------------------------------------------------- */
    let audioCtx = null;
    let musicBuffer = null;
    let musicSourceNode = null;
    let sfxBuffer = null;
    let isPlaying = false;

    async function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }

    async function decodeAudioBlob(blob) {
      if (!blob) return null;
      await initAudioContext();
      const arrayBuffer = await blob.arrayBuffer();
      return await audioCtx.decodeAudioData(arrayBuffer);
    }

    function playLoopingMusic() {
      if (!musicBuffer || isPlaying) return;
      musicSourceNode = audioCtx.createBufferSource();
      musicSourceNode.buffer = musicBuffer;
      musicSourceNode.loop = true; // Seamless loop handle via Web Audio API engine
      musicSourceNode.connect(audioCtx.destination);
      musicSourceNode.start(0);
      isPlaying = true;
      document.getElementById('music-status').innerText = 'Playing...';
      document.getElementById('play-music-btn').innerText = 'Pause Music ⏸';
    }

    function stopLoopingMusic() {
      if (musicSourceNode && isPlaying) {
        musicSourceNode.stop();
        musicSourceNode.disconnect();
        isPlaying = false;
        document.getElementById('music-status').innerText = 'Paused';
        document.getElementById('play-music-btn').innerText = 'Play Music 🎵';
      }
    }

    function playSoundEffect() {
      if (!sfxBuffer) return;
      initAudioContext();
      const sfxSource = audioCtx.createBufferSource();
      sfxSource.buffer = sfxBuffer;
      sfxSource.connect(audioCtx.destination);
      sfxSource.start(0);
    }

    /* ----------------------------------------------------------------------
       UI RENDERING & HELPERS
       ---------------------------------------------------------------------- */
    function applyTheme() {
      const root = document.documentElement;
      root.style.setProperty('--bg-color', profileState.theme.bg);
      root.style.setProperty('--card-bg', profileState.theme.card);
      root.style.setProperty('--text-color', profileState.theme.text);
      root.style.setProperty('--accent-color', profileState.theme.accent);
      root.style.setProperty('--button-bg', profileState.theme.button);

      if (profileState.bgImageBlob) {
        const url = URL.createObjectURL(profileState.bgImageBlob);
        root.style.setProperty('--bg-image', `url('${url}')`);
      } else {
        root.style.setProperty('--bg-image', 'none');
      }
    }

    function renderBioCard() {
      document.getElementById('preview-username').innerText = profileState.username || 'Anonymous';
      document.getElementById('preview-bio').innerText = profileState.bio || '';

      if (profileState.avatarBlob) {
        document.getElementById('preview-avatar').src = URL.createObjectURL(profileState.avatarBlob);
      }

      const linksContainer = document.getElementById('preview-links');
      linksContainer.innerHTML = '';
      profileState.links.forEach(link => {
        if (!link.title) return;
        const a = document.createElement('a');
        a.className = 'bio-link-btn';
        a.href = link.url || '#';
        a.target = '_blank';
        a.innerText = link.title;
        a.addEventListener('click', () => playSoundEffect());
        linksContainer.appendChild(a);
      });
    }

    function renderLinksEditor() {
      const listContainer = document.getElementById('links-editor-list');
      listContainer.innerHTML = '';
      profileState.links.forEach((link, index) => {
        const div = document.createElement('div');
        div.style.display = 'flex';
        div.style.gap = '5px';
        div.style.marginBottom = '5px';
        
        div.innerHTML = `
          <input type="text" placeholder="Title" value="${link.title}" data-index="${index}" class="link-title-input" />
          <input type="text" placeholder="URL" value="${link.url}" data-index="${index}" class="link-url-input" />
          <button class="btn btn-secondary remove-link-btn" data-index="${index}">X</button>
        `;
        listContainer.appendChild(div);
      });

      // Bind dynamic input listeners
      document.querySelectorAll('.link-title-input').forEach(input => {
        input.addEventListener('input', (e) => {
          profileState.links[e.target.dataset.index].title = e.target.value;
          renderBioCard();
        });
      });

      document.querySelectorAll('.link-url-input').forEach(input => {
        input.addEventListener('input', (e) => {
          profileState.links[e.target.dataset.index].url = e.target.value;
          renderBioCard();
        });
      });

      document.querySelectorAll('.remove-link-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          profileState.links.splice(e.target.dataset.index, 1);
          renderLinksEditor();
          renderBioCard();
        });
      });
    }

    /* ----------------------------------------------------------------------
       EVENT BINDINGS & APP INITIALIZATION
       ---------------------------------------------------------------------- */
    function bindEvents() {
      // Inputs
      document.getElementById('username-input').addEventListener('input', (e) => {
        profileState.username = e.target.value;
        renderBioCard();
      });

      document.getElementById('bio-input').addEventListener('input', (e) => {
        profileState.bio = e.target.value;
        renderBioCard();
      });

      document.getElementById('add-link-btn').addEventListener('click', () => {
        profileState.links.push({ title: 'New Link', url: 'https://' });
        renderLinksEditor();
        renderBioCard();
      });

      // Colors
      const colorPickers = [
        { id: 'bg-color-picker', key: 'bg' },
        { id: 'card-color-picker', key: 'card' },
        { id: 'text-color-picker', key: 'text' },
        { id: 'accent-color-picker', key: 'accent' },
        { id: 'btn-color-picker', key: 'button' }
      ];

      colorPickers.forEach(item => {
        document.getElementById(item.id).addEventListener('input', (e) => {
          profileState.theme[item.key] = e.target.value;
          applyTheme();
        });
      });

      // File Inputs
      document.getElementById('avatar-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          profileState.avatarBlob = file;
          renderBioCard();
        }
      });

      document.getElementById('bg-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          profileState.bgImageBlob = file;
          applyTheme();
        }
      });

      document.getElementById('music-file').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
          profileState.musicBlob = file;
          musicBuffer = await decodeAudioBlob(file);
          document.getElementById('music-status').innerText = 'Music Loaded';
        }
      });

      document.getElementById('sfx-file').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
          profileState.sfxBlob = file;
          sfxBuffer = await decodeAudioBlob(file);
        }
      });

      // Audio Control Button
      document.getElementById('play-music-btn').addEventListener('click', async () => {
        await initAudioContext();
        if (isPlaying) {
          stopLoopingMusic();
        } else {
          playLoopingMusic();
        }
      });

      // Database Save Button
      document.getElementById('save-db-btn').addEventListener('click', async () => {
        try {
          await saveProfileToDB(profileState);
          alert('Profile configuration successfully saved to IndexedDB!');
        } catch (err) {
          alert('Failed saving to IndexedDB: ' + err);
        }
      });

      // Mode Switcher
      const editorSec = document.getElementById('editor-section');
      const visitorSec = document.getElementById('visitor-section');
      const toggleBtn = document.getElementById('toggle-view-btn');
      const modeTitle = document.getElementById('mode-title');

      toggleBtn.addEventListener('click', () => {
        if (editorSec.classList.contains('hidden')) {
          editorSec.classList.remove('hidden');
          visitorSec.classList.add('hidden');
          toggleBtn.innerText = 'Switch to Visitor View';
          modeTitle.innerText = 'Bio Editor';
        } else {
          editorSec.classList.add('hidden');
          visitorSec.classList.remove('hidden');
          toggleBtn.innerText = 'Switch to Editor View';
          modeTitle.innerText = 'Visitor Preview';
        }
      });

      // Share Link Generation
      document.getElementById('share-btn').addEventListener('click', () => {
        const cleanName = encodeURIComponent(profileState.username || 'user');
        const shareUrl = `${window.location.origin}${window.location.pathname}#visitor?user=${cleanName}`;
        navigator.clipboard.writeText(shareUrl);
        alert(`Visitor link copied to clipboard:\n${shareUrl}`);
      });
    }

    /* ----------------------------------------------------------------------
       INITIALIZATION BOOTSTRAP
       ---------------------------------------------------------------------- */
    async function initApp() {
      // Populate fields from Saved DB state if available
      try {
        const savedData = await loadProfileFromDB();
        if (savedData) {
          profileState = { ...profileState, ...savedData };
        }
      } catch (e) {
        console.log('No prior state found in IndexedDB.');
      }

      // Sync form inputs with active state
      document.getElementById('username-input').value = profileState.username;
      document.getElementById('bio-input').value = profileState.bio;
      document.getElementById('bg-color-picker').value = profileState.theme.bg;
      document.getElementById('card-color-picker').value = profileState.theme.card;
      document.getElementById('text-color-picker').value = profileState.theme.text;
      document.getElementById('accent-color-picker').value = profileState.theme.accent;
      document.getElementById('btn-color-picker').value = profileState.theme.button;

      // Decode loaded media blobs if existent
      if (profileState.musicBlob) {
        musicBuffer = await decodeAudioBlob(profileState.musicBlob);
      }
      if (profileState.sfxBlob) {
        sfxBuffer = await decodeAudioBlob(profileState.sfxBlob);
      }

      // Check URL route parameters for direct Visitor Mode view
      if (window.location.hash.startsWith('#visitor')) {
        document.getElementById('editor-section').classList.add('hidden');
        document.getElementById('visitor-section').classList.remove('hidden');
        document.getElementById('toggle-view-btn').innerText = 'Switch to Editor View';
        document.getElementById('mode-title').innerText = 'Visitor Mode';
      }

      bindEvents();
      renderLinksEditor();
      applyTheme();
      renderBioCard();
    }

    // Launch App
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
