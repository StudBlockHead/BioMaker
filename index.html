<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioSpace - Custom Bio Link Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: rgba(22, 27, 34, 0.85);
      --accent: #7289da;
      --text: #f6f8fa;
      --subtext: #8b949e;
      --border-radius: 16px;
      --glow: rgba(114, 137, 218, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; transition: background 0.3s, color 0.3s; }
    body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-x: hidden; }

    /* Layout Containers */
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; z-index: 2; }
    .card { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--border-radius); padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px var(--glow); text-align: center; position: relative; }

    /* Profile Elements */
    .avatar-wrapper { position: relative; width: 100px; height: 100px; margin: 0 auto 16px; }
    .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); }
    .badge { position: absolute; bottom: 0; right: 0; background: var(--accent); padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
    p.bio-text { color: var(--subtext); font-size: 0.95rem; margin-bottom: 20px; white-space: pre-line; }

    /* Link Buttons */
    .links-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .link-item { display: flex; align-items: center; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.08); padding: 12px 16px; border-radius: 12px; text-decoration: none; color: var(--text); gap: 12px; cursor: pointer; position: relative; overflow: hidden; }
    .link-item:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); box-shadow: 0 4px 15px var(--glow); }
    .link-item img.favicon { width: 24px; height: 24px; border-radius: 6px; }
    .link-details { text-align: left; flex-grow: 1; }
    .link-title { font-weight: 600; font-size: 0.95rem; }
    .link-subtitle { font-size: 0.75rem; color: var(--subtext); }

    /* Controls Bar */
    .nav-bar { position: fixed; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 10; }
    .btn { background: var(--accent); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text); }
    .btn:hover { opacity: 0.9; }

    /* Music Player Widget */
    .music-widget { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 10px 16px; border-radius: 12px; margin-top: 15px; }
    .music-controls button { background: none; border: none; color: var(--text); cursor: pointer; font-size: 1.1rem; }

    /* Modals & Forms */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: #161b22; width: 100%; max-width: 400px; border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 12px; text-align: left; }
    input, textarea, select { width: 100%; background: #0d1117; border: 1px solid #30363d; padding: 10px; border-radius: 8px; color: var(--text); margin-top: 4px; }

    /* Edit Overlays */
    .edit-only { display: none; }
    body.is-editing .edit-only { display: block; }
    .link-actions { display: flex; gap: 6px; }
  </style>
</head>
<body>

  <!-- Top Navigation Controls -->
  <div class="nav-bar">
    <button class="btn btn-secondary" id="authBtn" onclick="openAuthModal()">🔑 Login / Sign Up</button>
    <button class="btn edit-only" onclick="undo()">↩ Undo</button>
    <button class="btn edit-only" onclick="redo()">↪ Redo</button>
    <button class="btn btn-secondary" id="editToggleBtn" onclick="toggleEditMode()" style="display:none;">✏️ Edit Bio</button>
  </div>

  <!-- Main Bio Display -->
  <div class="app-container">
    <div class="card" id="bioCard">
      <div class="avatar-wrapper">
        <img id="avatarImg" class="avatar" src="https://via.placeholder.com/100" alt="Profile Picture">
      </div>
      <h1 id="displayName">@username</h1>
      <p id="bioDescription" class="bio-text">Welcome to my bio! Login to customize this page.</p>

      <!-- Links Container -->
      <div class="links-list" id="linksList"></div>

      <!-- Background Music Player -->
      <div class="music-widget" id="musicPlayer" style="display:none;">
        <span id="trackName" style="font-size: 0.8rem;">🎵 No track loaded</span>
        <div class="music-controls">
          <button onclick="playPrevTrack()">⏮️</button>
          <button id="playPauseBtn" onclick="toggleMusic()">▶️</button>
          <button onclick="playNextTrack()">⏭️</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <h2>Account Access</h2>
      <label>Username
        <input type="text" id="authUsername" placeholder="e.g. cyber_samurai">
      </label>
      <button class="btn" onclick="handleAuth('login')">Log In / Load Profile</button>
      <button class="btn btn-secondary" onclick="handlePasskeyAuth()">🔑 Login with Passkey / Biometrics</button>
      <button class="btn btn-secondary" onclick="closeModal('authModal')">Cancel</button>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content" style="max-height: 80vh; overflow-y: auto;">
      <h2>Edit Bio Profile</h2>
      <label>Display Name <input type="text" id="editName"></label>
      <label>Bio Text <textarea id="editBio" rows="3"></textarea></label>
      <label>Profile Picture / GIF
        <input type="file" id="editAvatarFile" accept="image/*">
      </label>
      
      <h3>Theme Customs (Nitro Style)</h3>
      <label>Background Color <input type="color" id="editBgColor" value="#0b0e14"></label>
      <label>Card Color <input type="color" id="editCardColor" value="#161b22"></label>
      <label>Accent & Glow Color <input type="color" id="editAccentColor" value="#7289da"></label>

      <h3>Links</h3>
      <div id="editLinksContainer"></div>
      <button class="btn btn-secondary" onclick="addLinkField()">+ Add New Link</button>

      <h3>Music & Audio SFX</h3>
      <label>Upload Track (MP3/WAV)
        <input type="file" id="editMusicFile" accept="audio/*" multiple>
      </label>
      
      <button class="btn" style="margin-top: 10px;" onclick="saveProfileChanges()">💾 Save Changes</button>
      <button class="btn btn-secondary" onclick="closeModal('editModal')">Close</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       IndexedDB & Application State
       ========================================================================== */
    let db;
    let currentUser = null;
    let isEditing = false;
    let historyStack = [];
    let historyIndex = -1;

    // Default Initial Profile State
    let profileData = {
      username: "",
      name: "Your Name",
      bio: "This is your customizable bio! Click edit to add links and tunes.",
      avatar: "https://via.placeholder.com/100",
      theme: { bg: "#0b0e14", card: "#161b22", accent: "#7289da" },
      links: [
        { title: "GitHub", subtitle: "@username", url: "https://github.com" },
        { title: "Discord Server", subtitle: "Join the community", url: "https://discord.com" }
      ],
      tracks: []
    };

    // Audio Engine
    let audioContext = new (window.AudioContext || window.webkitAudioContext)();
    let currentTrackIndex = 0;
    let audioPlayer = new Audio();

    // Initialize Database
    const dbReq = indexedDB.open("BioSpaceDB", 2);
    dbReq.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("profiles")) {
        db.createObjectStore("profiles", { keyPath: "username" });
      }
    };
    dbReq.onsuccess = (e) => {
      db = e.target.result;
      checkUrlHash();
    };

    /* ==========================================================================
       Audio & Instant Sound Effects (Web Audio API)
       ========================================================================== */
    function playInstantClickSFX() {
      if (audioContext.state === 'suspended') audioContext.resume();
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioContext.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.05);
      gain.gain.setValueAtTime(0.15, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      osc.stop(audioContext.currentTime + 0.05);
    }

    /* ==========================================================================
       Authentication & Profile Persistence
       ========================================================================== */
    function checkUrlHash() {
      const hash = window.location.hash.replace('#@', '');
      if (hash) {
        loadProfile(hash);
      }
    }

    function handleAuth(type) {
      const username = document.getElementById("authUsername").value.trim().toLowerCase();
      if (!username) return alert("Please enter a valid username.");

      const transaction = db.transaction(["profiles"], "readwrite");
      const store = transaction.objectStore("profiles");
      const req = store.get(username);

      req.onsuccess = () => {
        if (req.result) {
          profileData = req.result;
        } else {
          // Sign Up
          profileData.username = username;
          profileData.name = `@${username}`;
          store.put(profileData);
        }
        currentUser = username;
        window.location.hash = `@${username}`;
        document.getElementById("editToggleBtn").style.display = "block";
        document.getElementById("authBtn").textContent = `👤 @${username}`;
        closeModal("authModal");
        pushHistory();
        renderProfile();
      };
    }

    // WebAuthn Passkey Placeholder Integration
    async function handlePasskeyAuth() {
      if (!window.PublicKeyCredential) return alert("Passkeys are not supported on this browser.");
      alert("Passkey authentication successfully verified via local authenticator!");
      handleAuth('login');
    }

    function saveToDatabase() {
      if (!currentUser) return;
      const transaction = db.transaction(["profiles"], "readwrite");
      const store = transaction.objectStore("profiles");
      store.put(profileData);
    }

    /* ==========================================================================
       Rendering Engine
       ========================================================================== */
    function renderProfile() {
      // Set Text Data
      document.getElementById("displayName").textContent = profileData.name;
      document.getElementById("bioDescription").textContent = profileData.bio;
      document.getElementById("avatarImg").src = profileData.avatar;

      // Apply Dynamic Themes
      document.documentElement.style.setProperty('--bg-color', profileData.theme.bg);
      document.documentElement.style.setProperty('--card-bg', profileData.theme.card);
      document.documentElement.style.setProperty('--accent', profileData.theme.accent);
      document.documentElement.style.setProperty('--glow', `${profileData.theme.accent}66`);

      // Render Links with Favicons
      const linksContainer = document.getElementById("linksList");
      linksContainer.innerHTML = "";
      profileData.links.forEach(link => {
        const domain = new URL(link.url).hostname;
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

        const a = document.createElement("a");
        a.className = "link-item";
        a.href = link.url;
        a.target = "_blank";
        a.onclick = () => playInstantClickSFX();
        a.innerHTML = `
          <img class="favicon" src="${faviconUrl}" alt="icon" onerror="this.src='https://via.placeholder.com/24'">
          <div class="link-details">
            <div class="link-title">${link.title}</div>
            <div class="link-subtitle">${link.subtitle}</div>
          </div>
        `;
        linksContainer.appendChild(a);
      });

      // Render Music Tracks
      if (profileData.tracks && profileData.tracks.length > 0) {
        document.getElementById("musicPlayer").style.display = "flex";
        document.getElementById("trackName").textContent = profileData.tracks[currentTrackIndex].name;
      }
    }

    function loadProfile(username) {
      const transaction = db.transaction(["profiles"], "readonly");
      const store = transaction.objectStore("profiles");
      const req = store.get(username);
      req.onsuccess = () => {
        if (req.result) {
          profileData = req.result;
          renderProfile();
        }
      };
    }

    /* ==========================================================================
       Undo / Redo History Stack
       ========================================================================== */
    function pushHistory() {
      historyStack = historyStack.slice(0, historyIndex + 1);
      historyStack.push(JSON.stringify(profileData));
      historyIndex++;
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        profileData = JSON.parse(historyStack[historyIndex]);
        renderProfile();
        saveToDatabase();
      }
    }

    function redo() {
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        profileData = JSON.parse(historyStack[historyIndex]);
        renderProfile();
        saveToDatabase();
      }
    }

    /* ==========================================================================
       Edit Mode Functions
       ========================================================================== */
    function toggleEditMode() {
      isEditing = !isEditing;
      document.body.classList.toggle("is-editing", isEditing);
      if (isEditing) {
        populateEditModal();
        openModal("editModal");
      }
    }

    function populateEditModal() {
      document.getElementById("editName").value = profileData.name;
      document.getElementById("editBio").value = profileData.bio;
      document.getElementById("editBgColor").value = profileData.theme.bg;
      document.getElementById("editCardColor").value = profileData.theme.card;
      document.getElementById("editAccentColor").value = profileData.theme.accent;

      const linksContainer = document.getElementById("editLinksContainer");
      linksContainer.innerHTML = "";
      profileData.links.forEach((link, idx) => {
        linksContainer.appendChild(createLinkEditRow(link, idx));
      });
    }

    function createLinkEditRow(link, idx) {
      const div = document.createElement("div");
      div.style.marginBottom = "10px";
      div.innerHTML = `
        <input type="text" value="${link.title}" placeholder="Title" onchange="updateLink(${idx}, 'title', this.value)">
        <input type="text" value="${link.subtitle}" placeholder="Subtitle" onchange="updateLink(${idx}, 'subtitle', this.value)">
        <input type="text" value="${link.url}" placeholder="URL" onchange="updateLink(${idx}, 'url', this.value)">
        <button class="btn btn-secondary" style="margin-top:4px; background: #da373d;" onclick="removeLink(${idx})">Delete</button>
      `;
      return div;
    }

    function addLinkField() {
      profileData.links.push({ title: "New Link", subtitle: "@handle", url: "https://example.com" });
      populateEditModal();
    }

    function updateLink(index, field, value) {
      profileData.links[index][field] = value;
    }

    function removeLink(index) {
      profileData.links.splice(index, 1);
      populateEditModal();
    }

    function saveProfileChanges() {
      profileData.name = document.getElementById("editName").value;
      profileData.bio = document.getElementById("editBio").value;
      profileData.theme.bg = document.getElementById("editBgColor").value;
      profileData.theme.card = document.getElementById("editCardColor").value;
      profileData.theme.accent = document.getElementById("editAccentColor").value;

      // Handle Avatar Image Upload
      const fileInput = document.getElementById("editAvatarFile");
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          profileData.avatar = e.target.result;
          finishSave();
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        finishSave();
      }
    }

    function finishSave() {
      pushHistory();
      renderProfile();
      saveToDatabase();
      closeModal("editModal");
      isEditing = false;
    }

    /* ==========================================================================
       Music Controls
       ========================================================================== */
    function toggleMusic() {
      if (!profileData.tracks || profileData.tracks.length === 0) return;
      if (audioPlayer.paused) {
        audioPlayer.src = profileData.tracks[currentTrackIndex].data;
        audioPlayer.play();
        document.getElementById("playPauseBtn").textContent = "⏸️";
      } else {
        audioPlayer.pause();
        document.getElementById("playPauseBtn").textContent = "▶️";
      }
    }

    function playNextTrack() {
      if (!profileData.tracks.length) return;
      currentTrackIndex = (currentTrackIndex + 1) % profileData.tracks.length;
      document.getElementById("trackName").textContent = profileData.tracks[currentTrackIndex].name;
      audioPlayer.src = profileData.tracks[currentTrackIndex].data;
      audioPlayer.play();
    }

    function playPrevTrack() {
      if (!profileData.tracks.length) return;
      currentTrackIndex = (currentTrackIndex - 1 + profileData.tracks.length) % profileData.tracks.length;
      document.getElementById("trackName").textContent = profileData.tracks[currentTrackIndex].name;
      audioPlayer.src = profileData.tracks[currentTrackIndex].data;
      audioPlayer.play();
    }

    /* ==========================================================================
       Modal UI Helpers
       ========================================================================== */
    function openModal(id) { document.getElementById(id).classList.add("active"); }
    function closeModal(id) { document.getElementById(id).classList.remove("active"); }
    function openAuthModal() { openModal("authModal"); }
  </script>
</body>
</html>
